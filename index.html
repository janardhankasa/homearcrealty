  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:#fff;color:#1a1a2e;overflow-x:hidden}
    :root{--navy:#0D1B2A;--gold:#C8A96E;--gold2:#D9BC82;--cream:#F8F6F1;--border:#EDE9E0}
    .ff{font-family:'Cormorant Garamond',Georgia,serif}
    .hero-bg{min-height:100vh;background:linear-gradient(160deg,rgba(13,27,42,.93) 0%,rgba(13,27,42,.72) 55%,rgba(13,27,42,.88) 100%),url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=85') center/cover no-repeat;display:flex;flex-direction:column}
    .glass{background:rgba(255,255,255,.10);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.18)}
    .btn-gold{background:linear-gradient(135deg,#C8A96E,#D9BC82);color:#0D1B2A;font-weight:600;letter-spacing:.02em;border:none;cursor:pointer;transition:all .3s ease;font-family:'DM Sans',sans-serif}
    .btn-gold:hover{background:linear-gradient(135deg,#D9BC82,#EAD098);transform:translateY(-2px);box-shadow:0 12px 32px rgba(200,169,110,.45)}
    .btn-navy{background:#0D1B2A;color:#fff;font-weight:600;border:none;cursor:pointer;transition:all .3s ease;font-family:'DM Sans',sans-serif}
    .btn-navy:hover{background:#162033;transform:translateY(-2px)}
    .btn-outline-white{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);font-weight:600;cursor:pointer;transition:all .3s ease;font-family:'DM Sans',sans-serif}
    .btn-outline-white:hover{background:rgba(255,255,255,.12)}
    .btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:600;border:none;cursor:pointer;transition:all .3s ease;font-family:'DM Sans',sans-serif}
    .btn-wa:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,211,102,.4)}
    .prop-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 22px rgba(13,27,42,.07);transition:all .4s ease}
    .prop-card:hover{transform:translateY(-8px);box-shadow:0 24px 60px rgba(13,27,42,.14)}
    .prop-img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;position:absolute;top:0;left:0}
    .prop-card:hover .prop-img{transform:scale(1.06)}
    .why-card{background:#fff;border-radius:16px;border:1px solid var(--border);transition:all .3s ease;padding:30px 26px}
    .why-card:hover{border-color:#C8A96E;transform:translateY(-4px);box-shadow:0 16px 40px rgba(200,169,110,.12)}
    .why-icon{background:rgba(200,169,110,.1);color:#C8A96E;border-radius:14px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;transition:all .3s ease}
    .why-card:hover .why-icon{background:linear-gradient(135deg,#C8A96E,#D9BC82);color:#0D1B2A}
    .test-card{background:linear-gradient(145deg,#fff 0%,#F8F6F1 100%);border:1px solid var(--border);border-radius:20px;transition:all .3s ease;padding:26px 22px}
    .test-card:hover{box-shadow:0 16px 40px rgba(13,27,42,.1);border-color:#C8A96E;transform:translateY(-4px)}
    .badge-buy{background:linear-gradient(135deg,#0D1B2A,#162033);color:#C8A96E;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .badge-rent{background:linear-gradient(135deg,#C8A96E,#D9BC82);color:#0D1B2A;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .nav{transition:all .3s ease;position:fixed;top:0;left:0;right:0;z-index:50;font-family:'DM Sans',sans-serif}
    .nav-solid{background:rgba(13,27,42,.97)!important;backdrop-filter:blur(20px);box-shadow:0 4px 30px rgba(0,0,0,.3)}
    .ftab-on{background:linear-gradient(135deg,#C8A96E,#D9BC82);color:#0D1B2A;font-weight:700}
    .ftab-off{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
    .ftab-off:hover{background:rgba(255,255,255,.25);color:#fff}
    .fsel{border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;background:rgba(255,255,255,.96);color:#1a1a2e;width:100%;cursor:pointer;appearance:none;-webkit-appearance:none}
    .fsel:focus{outline:none;border-color:#C8A96E}
    .finput{border:1.5px solid #E8E4DC;border-radius:8px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:15px;background:#fff;color:#1a1a2e;width:100%;transition:border-color .2s}
    .finput:focus{outline:none;border-color:#C8A96E;box-shadow:0 0 0 3px rgba(200,169,110,.12)}
    .car-btn{background:rgba(13,27,42,.7);color:#fff;border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:absolute;top:50%;transform:translateY(-50%)}
    .car-btn:hover{background:#C8A96E}
    .loc-card{border-radius:16px;overflow:hidden;position:relative;cursor:pointer;transition:all .4s ease;height:258px}
    .loc-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(13,27,42,.2)}
    .loc-img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;position:absolute;top:0;left:0}
    .loc-card:hover .loc-img{transform:scale(1.07)}
    .loc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,27,42,.92) 0%,rgba(13,27,42,.25) 55%,transparent 100%)}
    .vid-card{border-radius:16px;overflow:hidden;position:relative;cursor:pointer;transition:all .4s ease;height:280px}
    .vid-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .vid-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 55%,transparent 100%)}
    .play-btn{transition:all .3s ease;background:rgba(200,169,110,.85);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
    .vid-card:hover .play-btn{transform:scale(1.15);background:rgba(200,169,110,1)}
    .modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:mFadeIn .2s ease}
    @keyframes mFadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{background:#fff;border-radius:20px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;animation:mSlideUp .3s ease}
    @keyframes mSlideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    .am-badge{background:rgba(200,169,110,.1);color:#7A5C1E;border:1px solid rgba(200,169,110,.3);border-radius:20px;padding:5px 13px;font-size:13px;display:inline-flex;align-items:center;gap:5px;margin:4px}
    .wa-float{position:fixed;bottom:26px;right:26px;z-index:999;border-radius:50%;width:58px;height:58px;border:none;cursor:pointer;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,211,102,.45);animation:waPulse 2.5s infinite;text-decoration:none}
    @keyframes waPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}50%{box-shadow:0 0 0 14px rgba(37,211,102,0)}}
    .footer-bg{background:linear-gradient(135deg,#0D1B2A 0%,#081422 100%)}
    .grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px}
    .grid-why{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:22px}
    .grid-loc{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:22px}
    .grid-test{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}
    .grid-vid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
    .grid-contact{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
    .grid-footer{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:44px}
    .section-tag{color:#C8A96E;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
    .section-sub{color:#6B7280;font-size:16px;max-width:540px;margin:0 auto}
    @media(max-width:900px){
      .grid-contact{grid-template-columns:1fr!important}
      .grid-footer{grid-template-columns:1fr 1fr!important}
      .nav-links,.nav-phone{display:none!important}
      .mob-menu-btn{display:flex!important}
      .filter-grid{grid-template-columns:1fr 1fr!important}
    }
    @media(max-width:600px){
      .grid-footer{grid-template-columns:1fr!important}
      .filter-grid{grid-template-columns:1fr!important}
      .stats-row{gap:20px!important}
      .hero-ctas{flex-direction:column;align-items:center}
      .modal-nearby{grid-template-columns:1fr!important}
      .modal-ctas{flex-direction:column}
    }
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:#F1EFE9}
    ::-webkit-scrollbar-thumb{background:#C8A96E;border-radius:10px}

// CAROUSEL
function Car({imgs,h}){
  const [i,si]=useState(0);
  const prev=e=>{e?.stopPropagation();si((i-1+imgs.length)%imgs.length)};
  const next=e=>{e?.stopPropagation();si((i+1)%imgs.length)};
  return(
    <div style={{position:"relative",height:h,overflow:"hidden"}}>
      <img src={imgs[i]} alt="" loading="lazy" className="prop-img"/>
      {imgs.length>1&&<>
        <button className="car-btn" onClick={prev} style={{left:10}}><IcoChL size={17}/></button>
        <button className="car-btn" onClick={next} style={{right:10}}><IcoChR size={17}/></button>
        <div style={{position:"absolute",bottom:10,left:"50%",transform:"translateX(-50%)",display:"flex",gap:5}}>
          {imgs.map((_,j)=><button key={j} onClick={e=>{e.stopPropagation();si(j);}} style={{width:j===i?20:6,height:6,borderRadius:3,border:"none",cursor:"pointer",background:j===i?"#C8A96E":"rgba(255,255,255,.65)",transition:"all .2s"}}/>)}
        </div>
      </>}
    </div>
  );
}
